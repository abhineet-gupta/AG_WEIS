userPreferences:
  openfast:
    file_path:
      file1: None
    graph:
      xaxis: Time
      yaxis:
      - Wind1VelX
      - GenPwr
      - BldPitch1
      - GenSpeed
      - PtfmPitch
  optimization:
    convergence:
      channels:
      - floating.jointdv_0
      - floating.jointdv_1
      - floating.memgrp1.outer_diameter_in
      - raft.Max_PtfmPitch
      - floatingse.system_structural_mass
    dlc:
      xaxis: Wind1VelX
      xaxis_stat: mean
      yaxis:
      - Wind1VelY
      - GenSpeed
      - PtfmPitch
      yaxis_stat: max
    timeseries:
      channels:
      - Wind1VelX
      - GenPwr
      - BldPitch1
      - GenSpeed
      - PtfmPitch
  wisdem:
    blade:
      shape_yaxis:
      - rotorse.rc.chord_m
      - rotorse.re.pitch_axis
      - rotorse.theta_deg
      struct_yaxis:
      - rotorse.rhoA_kg/m
      struct_yaxis_log:
      - rotorse.EA_N
      - rotorse.EIxx_N*m**2
      - rotorse.EIyy_N*m**2
      - rotorse.GJ_N*m**2
      xaxis: rotorse.rc.s
    output_path: ../../../../examples/02_run_openfast_cases/outputs/DLC22
